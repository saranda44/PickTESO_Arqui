<!-- products-list.html -->
<div class="products-list">
  @if (error()) {
    <div class="alert alert--error">
      {{ error() }}
      <button (click)="error.set(null)" class="alert__close">X</button>
    </div>
  }

  <!-- Modal de edición -->
  <app-reusable-modal [visible]="modalVisible()" [title]="modalTitle()" (close)="onModalClose()">
    <form (submit)="$event.preventDefault(); submitEdit()" class="edit-form">
      <div class="form-group">
        <label for="name">Nombre *</label>
        <input
          id="name"
          name="name"
          type="text"
          [(ngModel)]="formName"
          placeholder="Ej: Producto Premium"
        />
      </div>

      <div class="form-group">
        <label for="description">Descripción</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="formDescription"
          placeholder="Describe el producto..."
        ></textarea>
      </div>

      <div class="form-group">
        <label for="price">Precio *</label>
        <input
          id="price"
          name="price"
          type="number"
          step="0.01"
          [(ngModel)]="formPrice"
          placeholder="Ej: 99.99"
        />
      </div>

      <div class="form-group">
        <label for="image">Imagen del Producto</label>
        <input
          id="image"
          type="file"
          (change)="onFileSelected($event)"
          accept="image/jpeg,image/png,image/webp"
        />
        <small>Max 5MB, formatos: JPEG, PNG, WebP. Reemplaza la imagen actual</small>
      </div>
    </form>

    <div class="modal-actions">
      <button type="button" class="btn-cancel" (click)="onModalClose()">Cancelar</button>
      <button type="submit" class="btn-save" (click)="submitEdit()">Guardar</button>
    </div>
  </app-reusable-modal>

  <!-- <button (click)="loadProducts()" class="load-btn">Cargar Productos</button> -->

  @if (products().length === 0) {
    <p class="empty-message">No hay productos</p>
  } @else {
    <div class="products-grid">
      @for (product of products(); track product.id) {
        @if (product.active === true) {
          <app-product-card
            [product]="product"
            [inventory]="getInventory(product.id)"
            (edit)="onEdit($event)"
            (delete)="onDelete($event)"
            (adjustInventory)="onAdjustInventory($event)"
          />
        }
      }
    </div>
  }
</div>
