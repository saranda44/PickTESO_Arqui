<header class="header">
  <div class="header__container" [class.header__container--centered]="!isLoggedIn()">
    <h1 class="logo">Panel de Vendedores - PickTESO</h1>

    @if (isLoggedIn()) {
      <button class="hamburger" (click)="toggleMenu()" [class.hamburger--active]="menuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </button>

      @if (menuOpen()) {
        <div class="nav-backdrop" (click)="closeMenu()"></div>
      }

      <nav class="nav" [class.nav--open]="menuOpen()">
        <a (click)="closeMenu()">Pedidos</a>
        <a (click)="closeMenu()">Productos</a>
        <button (click)="logout()" class="nav__logout" title="Cerrar sesión">Salir 🚪</button>
      </nav>
    }
  </div>
</header>
