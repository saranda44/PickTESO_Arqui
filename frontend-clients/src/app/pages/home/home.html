<div class="home-container">

  <h1 class="title">
    ¿Qué se te <span class="bold">antoja</span><br />
     el día de hoy?
  </h1>

  <p class="subtitle">
    Sencillamente, lo que quieres.
  </p>

  <h2 class="section-title">Nuestras Tiendas:</h2>

  <div class="cards-container">
    <div class="card" *ngFor="let restaurant of restaurants">
      
      <img [src]="restaurant.image" alt="food" />

      <div class="card-content">
        <h2>{{ restaurant.name }}</h2>
        <p>{{ restaurant.cafeteria }}</p>
      </div>

    </div>
  </div>

</div>
